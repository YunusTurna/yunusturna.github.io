<!--===== SKILLS =====-->
<section class="skills section" id="skills">
    <h2 class="section-title">Skills</h2>

    <div class="skills__container bd-grid">
        <div class="skills__grid">
            <!-- Unity -->
            <div class="skills__box skills__box--unity">
                <img src="assets/img/unityLogo.png" alt="Unity Logo" class="skills__icon" />
                <span class="skills__name">Unity</span>
            </div>

            <!-- C# -->
            <div class="skills__box skills__box--csharp">
                <img src="assets/img/csharpLogo.png" alt="C# Logo" class="skills__icon" />
                <span class="skills__name">C#</span>
            </div>

            <!-- Flutter -->
            <div class="skills__box skills__box--flutter">
                <img src="assets/img/flutterLogo.svg" alt="Flutter Logo" class="skills__icon" />
                <span class="skills__name">Flutter</span>
            </div>

            <!-- Dart -->
            <div class="skills__box skills__box--dart">
                <img src="assets/img/dart-language.png" alt="Dart Logo" class="skills__icon" />
                <span class="skills__name">Dart</span>
            </div>
        </div>
    </div>
</section>
